<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKAN</title>
</head>

<body>
    <!--the main heading -->
    <h1>AKAN NAME GENERATOR</h1>
    <!--description of akan names generator-->
    <p>Akan names originate from the Akan people who live in Ghana and is tradinationally based on the day of the week
        you were<br>
        born, with different names for males and females. They are important because they help us connect birth and
        destiny and also<br>
        give us social meaning.
    </p>

    <!--input form for birthdate and gender-->
    <form>
        <label for="birthdate">Birthdate:</label><br>
        <input type="date" id="birthdate" name="birthdate" required><br>
        <label for="gender">Your Gender</label><br>
        <select id="gender" name="gender" required>
            <option value="">*Choose*</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
        <button type="submit">SUBMIT</button>
    </form>

    <!--display section-->
    <p id="result"></p>
</body>

</html>
